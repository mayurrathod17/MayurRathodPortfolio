<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emotion Detection System</title>

<style>
body{
  font-family:"Segoe UI", sans-serif;
  background:#f4f6f8;
  padding:30px;
}

h1{
  text-align:center;
  color:#0a2540;
}

.project-info{
  max-width:900px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

  margin-top:20px;
}

  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);

</head>

<body>

<h1>Emotion Detection System</h1>

<div class="project-info">
  <p>
    Built a machine learning-based system that detects human emotions from facial
    expressions using image processing techniques and trained ML models.
  </p>

  <h3>Screenshots</h3>

  <div class="gallery">
    <img src="emotion1.png" alt="Emotion Detection Screenshot 1">
    <img src="emotion2.png" alt="Emotion Detection Screenshot 2">
  </div>
</div>

</html>
