<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Certificates</title>
<style>
body{
  font-family:"Segoe UI", sans-serif;
  background:#f4f6f8;
  padding:30px;
}

h1{
  text-align:center;
  color:#0a2540;
  margin-bottom:30px;
}

.certs{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.cert-card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  text-align:center;
}

.cert-card h3{
  margin-bottom:10px;
}

.cert-card a{
  display:inline-block;
  padding:10px 18px;
  background:#007bff;
  color:white;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>My Certifications</h1>

<div class="certs">

  <div class="cert-card">
    <h3>IBM Skillsbuild Certification</h3>
    <a href="cert-ibm.pdf" target="_blank">View Certificate</a>
  </div>

  <div class="cert-card">
    <h3>Java Session Certification</h3>
    <a href="cert-javasession.pdf" target="_blank">View Certificate</a>
  </div>

  <div class="cert-card">
    <h3>Public Speaking Certification</h3>
    <a href="cert-nptel.pdf" target="_blank">View Certificate</a>
  </div>

</div>

</body>
</html>
